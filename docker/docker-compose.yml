version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: eda_genius_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: eda_user
      POSTGRES_PASSWORD: eda_password
      POSTGRES_DB: eda_genius
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eda_user -d eda_genius"]
      interval: 5s
      timeout: 5s
      retries: 5

  chromadb:
    image: chromadb/chroma:latest
    container_name: eda_genius_chromadb
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE

  ollama:
    image: ollama/ollama:latest
    container_name: eda_genius_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

volumes:
  postgres_data:
  chroma_data:
  ollama_models:
